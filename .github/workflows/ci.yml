name: iOS CI

# A pull request run already checks main merged with the branch, so re-running the same
# tree after merge only doubles the macOS bill. Keep "Require branches to be up to date"
# on in branch protection so the run that passes is the tree that lands.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_REPOSITORY: lucadumi/roomlings
  WEB_REVISION: b06cd70d216eb0242af3238dcc18ccd577112f97
  ROOMLINGS_WEB_ROOT: ../roomlings

defaults:
  run:
    working-directory: roomlings-ios

jobs:
  # A revision that main cannot reach is not published. It can be rewritten or deleted
  # while these jobs still pass, so check it before spending the macOS minutes.
  web-revision:
    name: Pinned web revision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require the pinned web revision to be on the web main branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! comparison=$(gh api "repos/$WEB_REPOSITORY/compare/main...$WEB_REVISION" 2>&1); then
            echo "Could not compare $WEB_REVISION against $WEB_REPOSITORY main."
            echo "$comparison"
            exit 1
          fi
          unreachable=$(printf '%s' "$comparison" | jq -r '.ahead_by')
          if [ "$unreachable" != 0 ]; then
            echo "$WEB_REVISION is not on $WEB_REPOSITORY main."
            echo "It holds $unreachable commit(s) that main does not, so it was orphaned or never merged."
            echo "Merge that work into main, then pin a revision main contains."
            exit 1
          fi

  renderer:
    name: Shared renderer
    needs: web-revision
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          path: roomlings-ios
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.WEB_REPOSITORY }}
          ref: ${{ env.WEB_REVISION }}
          path: roomlings
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: roomlings/package-lock.json
      - name: Check release and invitation link safeguards
        run: node --test Tests/Release/release.test.mjs Tests/Invitations/invitation-links.test.mjs
      - name: Check native shard coverage
        run: node --test Tests/CI/native-test-plan.test.mjs
      - run: npm --prefix ../roomlings ci --no-audit --no-fund
      - name: Check the preinstalled browser version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const lock = JSON.parse(readFileSync("../roomlings/package-lock.json", "utf8"));
            if (lock.packages["node_modules/@playwright/test"].version !== "1.63.0") {
              throw new Error("Align the Playwright image with the pinned web lockfile.");
            }
          '
      - run: node Scripts/build-room.mjs
      - name: Check shared-source icon and launch artwork
        run: node --test Tests/Branding/brand-assets.test.mjs
      - run: node --test Tests/RoomRenderer/room-renderer.test.mjs

  native:
    name: Native (${{ matrix.name }}, ${{ matrix.shard }}/2)
    needs: web-revision
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        name: [iPhone, iPad]
        shard: [1, 2]
        include:
          - name: iPhone
            simulator: iPhone 17 Pro
          - name: iPad
            simulator: iPad Pro 11-inch (M5)
    steps:
      - uses: actions/checkout@v7
        with:
          path: roomlings-ios
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ${{ env.WEB_REPOSITORY }}
          ref: ${{ env.WEB_REVISION }}
          path: roomlings
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: roomlings/package-lock.json
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Start the iOS 26.5 simulator
        id: simulator
        env:
          SIMULATOR_NAME: ${{ matrix.simulator }}
        run: |
          device=$(xcrun simctl list devices available --json | jq -r --arg name "$SIMULATOR_NAME" '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"][]
            | select(.name == $name and .isAvailable)
            | .udid
          ')
          test -n "$device"
          xcrun simctl boot "$device"
          echo "destination=platform=iOS Simulator,arch=$(uname -m),id=$device" >> "$GITHUB_OUTPUT"
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - run: npm --prefix ../roomlings ci --no-audit --no-fund
      - run: swift test --package-path Packages/RoomlingsCore
        if: matrix.shard == 1
      - name: Check Xcode invitation entitlement selection
        if: matrix.name == 'iPhone' && matrix.shard == 1
        run: node --test Tests/Invitations/invitation-links.test.mjs
      - name: Build the unsigned device release and verify its metadata
        if: matrix.name == 'iPhone' && matrix.shard == 1
        run: |
          xcodebuild -project Roomlings.xcodeproj -scheme Roomlings \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath Build/Release -quiet build \
            NODE_BINARY="$(command -v node)" \
            ROOMLINGS_WEB_ROOT="$GITHUB_WORKSPACE/roomlings" \
            MARKETING_VERSION=0.1.0 CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            ROOMLINGS_API_HOST=api.release-check.invalid \
            ROOMLINGS_INVITATION_HOST=release-check.invalid \
            CODE_SIGNING_ALLOWED=NO
          info=Build/Release/Build/Products/Release-iphoneos/Roomlings.app/Info.plist
          test "$(plutil -extract CFBundleShortVersionString raw "$info")" = 0.1.0
          test "$(plutil -extract CFBundleVersion raw "$info")" = "$GITHUB_RUN_NUMBER"
          test "$(plutil -extract RoomlingsAPIOrigin raw "$info")" = https://api.release-check.invalid
          test "$(plutil -extract RoomlingsInvitationOrigin raw "$info")" = https://release-check.invalid
          test "$(plutil -extract RoomlingsAPNsEnvironment raw "$info")" = production
          test "$(plutil -extract CFBundleIcons.CFBundlePrimaryIcon.CFBundleIconName raw "$info")" = AppIcon
          test "$(plutil -extract UILaunchStoryboardName raw "$info")" = LaunchScreen
          test -d Build/Release/Build/Products/Release-iphoneos/Roomlings.app/LaunchScreen.storyboardc
          privacy=Build/Release/Build/Products/Release-iphoneos/Roomlings.app/PrivacyInfo.xcprivacy
          plutil -lint "$privacy"
          test "$(plutil -convert json -o - "$privacy" | jq -Sc .)" = \
            "$(plutil -convert json -o - Roomlings/PrivacyInfo.xcprivacy | jq -Sc .)"
      - name: Wait for the simulator
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: xcrun simctl bootstatus "$DEVICE" -b
      - name: Run the native account and room shard
        timeout-minutes: 60
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
          SHARD: ${{ matrix.shard }}
        run: node Scripts/test-accounts.mjs --destination "$DESTINATION" --include-room --shard "$SHARD/2"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: native-failure-${{ matrix.name }}-${{ matrix.shard }}
          path: |
            roomlings-ios/Build/*.xcresult
            roomlings-ios/Build/Test-enumeration-*.json
          if-no-files-found: ignore
          retention-days: 7

  complete:
    name: iOS checks
    if: ${{ always() }}
    needs: [web-revision, renderer, native]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every job to pass
        env:
          WEB_REVISION_RESULT: ${{ needs.web-revision.result }}
          RENDERER_RESULT: ${{ needs.renderer.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: |
          test "$WEB_REVISION_RESULT" = success &&
            test "$RENDERER_RESULT" = success &&
            test "$NATIVE_RESULT" = success
