name: iOS CI

# A pull request run already checks main merged with the branch, so re-running the same
# tree after merge only doubles the macOS bill. Keep "Require branches to be up to date"
# on in branch protection so the run that passes is the tree that lands.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WEB_REVISION: 1fdeeb7e3a9c9fca7686cef2060b331a684117ce
  ROOMLINGS_WEB_ROOT: ../roomlings

defaults:
  run:
    working-directory: roomlings-ios

jobs:
  renderer:
    name: Shared renderer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          path: roomlings-ios
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: lucadumi/roomlings
          ref: ${{ env.WEB_REVISION }}
          path: roomlings
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: roomlings/package-lock.json
      - run: npm --prefix ../roomlings ci --no-audit --no-fund
      - name: Check the preinstalled browser version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const lock = JSON.parse(readFileSync("../roomlings/package-lock.json", "utf8"));
            if (lock.packages["node_modules/@playwright/test"].version !== "1.63.0") {
              throw new Error("Align the Playwright image with the pinned web lockfile.");
            }
          '
      - run: node Scripts/build-room.mjs
      - run: node --test Tests/RoomRenderer/room-renderer.test.mjs

  native:
    name: Native (${{ matrix.name }})
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iPhone
            simulator: iPhone 17 Pro
          - name: iPad
            simulator: iPad Pro 11-inch (M5)
    steps:
      - uses: actions/checkout@v7
        with:
          path: roomlings-ios
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: lucadumi/roomlings
          ref: ${{ env.WEB_REVISION }}
          path: roomlings
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: roomlings/package-lock.json
      - name: Select Xcode 26.6
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer
          xcodebuild -version
      - name: Start the iOS 26.5 simulator
        id: simulator
        env:
          SIMULATOR_NAME: ${{ matrix.simulator }}
        run: |
          device=$(xcrun simctl list devices available --json | jq -r --arg name "$SIMULATOR_NAME" '
            .devices["com.apple.CoreSimulator.SimRuntime.iOS-26-5"][]
            | select(.name == $name and .isAvailable)
            | .udid
          ')
          test -n "$device"
          xcrun simctl boot "$device"
          echo "destination=platform=iOS Simulator,arch=$(uname -m),id=$device" >> "$GITHUB_OUTPUT"
          echo "device=$device" >> "$GITHUB_OUTPUT"
      - run: npm --prefix ../roomlings ci --no-audit --no-fund
      - run: swift test --package-path Packages/RoomlingsCore
      - name: Build the release app
        if: matrix.name == 'iPhone'
        run: |
          xcodebuild -project Roomlings.xcodeproj -scheme Roomlings \
            -configuration Release -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath Build/Release -quiet build \
            NODE_BINARY="$(command -v node)" \
            ROOMLINGS_WEB_ROOT="$GITHUB_WORKSPACE/roomlings" \
            CODE_SIGNING_ALLOWED=NO
      - name: Wait for the simulator
        env:
          DEVICE: ${{ steps.simulator.outputs.device }}
        run: xcrun simctl bootstatus "$DEVICE" -b
      - name: Run native account and room flows
        timeout-minutes: 60
        env:
          DESTINATION: ${{ steps.simulator.outputs.destination }}
        run: node Scripts/test-accounts.mjs --destination "$DESTINATION" --include-room
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && failure() }}
        with:
          name: native-failure-${{ matrix.name }}
          path: roomlings-ios/Build/*.xcresult
          if-no-files-found: ignore
          retention-days: 7

  complete:
    name: iOS checks
    if: ${{ always() }}
    needs: [renderer, native]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    defaults:
      run:
        working-directory: .
    steps:
      - name: Require every job to pass
        env:
          RENDERER_RESULT: ${{ needs.renderer.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$RENDERER_RESULT" = success && test "$NATIVE_RESULT" = success
